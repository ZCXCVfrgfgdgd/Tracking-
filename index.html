<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Tracker • Максим</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0a150f, #000);
      color: #0f8; min-height: 100vh; padding: 10px; box-sizing: border-box;
    }
    h1 { text-align: center; color: #0f0; margin: 15px 0; }
    .container { max-width: 460px; margin: 0 auto; }
    .card {
      background: rgba(0,0,0,0.7); border: 2px solid #0f03;
      border-radius: 16px; margin: 16px auto; padding: 16px;
      box-shadow: 0 4px 20px rgba(0,255,80,0.1);
    }
    .icon { font-size: 60px; text-align: center; margin-bottom: 6px; display: block; }
    .title { text-align: center; font-size: 22px; margin: 0 0 10px; color: #0ff; }
    .big-score {
      font-size: 64px; font-weight: bold; text-align: center; margin: 6px 0; line-height: 1;
    }
    .big-score.good { color: #0f8; }
    .big-score.mid  { color: #ff8; }
    .big-score.bad  { color: #f44; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    td { padding: 8px 4px; border-bottom: 1px solid #222; }
    .score-col { width: 30px; text-align: center; font-size: 20px; font-weight: bold; }
    tr.active { background: rgba(0,255,80,0.15); font-weight: bold; }
    button {
      background: #0a5; color: #fff; border: none; padding: 12px; font-size: 17px;
      border-radius: 10px; width: 100%; margin: 10px 0; cursor: pointer;
    }
    button:hover { background: #0c7; }
    button.google { background: #4285F4; }
    button.google:hover { background: #357ae8; }
    .auth-info { text-align: center; font-size: 16px; margin: 15px 0; color: #0cc; }
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-content {
      background: #111; border: 2px solid #0f8; border-radius: 16px;
      padding: 20px; width: 90%; max-width: 420px; max-height: 90vh; overflow-y: auto;
    }
    input, select, input[type="time"] {
      width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px;
      background: #222; border: 1px solid #0f03; color: #0f8; font-size: 15px;
    }
    label { display: block; margin: 10px 0 4px; color: #0cc; }
    .day-label { font-size: 12px; color: #0f0; text-align: center; margin-top: 4px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Daily Tracker • Максим</h1>

  <div id="auth-section" class="card">
    <div class="auth-info" id="user-info">Не авторизовано</div>
    <button class="google" onclick="signInWithGoogle()">Увійти через Google</button>
    <button onclick="signOut()" id="signout-btn" style="display:none; background:#444;">Вийти</button>
  </div>

  <div id="main-content" style="display:none;">
    <button onclick="openModal()">Ввести / редагувати дані за сьогодні</button>
    <button onclick="compareWithYesterday()">Порівняти з вчора</button>

    <!-- Приклад карток (можеш додати інші аналогічно) -->
    <div id="nutrition-card" class="card">
      <span class="icon">🍩</span>
      <div class="title">Харчування</div>
      <div id="nutrition-score" class="big-score">— / 5</div>
      <table id="nutrition-table"></table>
    </div>

    <div id="sleep-card" class="card">
      <span class="icon">😴</span>
      <div class="title">Сон</div>
      <div id="sleep-score" class="big-score">— / 5</div>
      <table id="sleep-table"></table>
    </div>

    <!-- Загальний підсумок -->
    <div id="total-card" class="card">
      <span class="icon">🌟</span>
      <div class="title">ІТОГИ ДНЯ</div>
      <div id="total-score" class="big-score">— / 5</div>
    </div>

    <!-- Календар -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <button onclick="prevMonth()" style="width:40px;background:#0a3;">‹</button>
        <span id="month-year" style="font-size:18px;color:#0f0;"></span>
        <button onclick="nextMonth()" style="width:40px;background:#0a3;">›</button>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr><th>Пн</th><th>Вт</th><th>Ср</th><th>Чт</th><th>Пт</th><th>Сб</th><th>Нд</th></tr></thead>
        <tbody id="calendar-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Модальне вікно -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h2>Дані за <span id="modal-date"></span></h2>

    <label>Кроки сьогодні</label>
    <input type="number" id="steps" placeholder="12000">

    <label>Харчування</label>
    <select id="nutrition">
      <option value="0">— обери —</option>
      <option value="5">2 прийоми, невеликі порції, здорове</option>
      <option value="4">3 прийоми, здорове</option>
      <option value="3">Переїдання здорової</option>
      <option value="2">Фастфуд/солодощі без переїдання</option>
      <option value="1">Переїдання + фастфуд + солодощі</option>
    </select>

    <label>Фраги на DM</label>
    <input type="number" id="dm-frags" placeholder="750">

    <label>Матчів Faceit</label>
    <input type="number" id="faceit-matches" placeholder="6">

    <label>Ліг спати о</label>
    <input type="time" id="sleep-start">

    <label>Проснувся о</label>
    <input type="time" id="sleep-end">

    <!-- Додай інші поля, якщо треба (ELO, K/D тощо) -->

    <button onclick="saveData()" style="margin-top:20px;">Зберегти</button>
    <button onclick="closeModal()" style="background:#333;">Закрити</button>
  </div>
</div>

<script>
// ==================== FIREBASE ====================
const firebaseConfig = {
  apiKey: "AIzaSyBAp-zAE1ckJoCdJsl_eOu6vBqNWdK8cqE",
  authDomain: "tracking-9b296.firebaseapp.com",
  projectId: "tracking-9b296",
  storageBucket: "tracking-9b296.firebasestorage.app",
  messagingSenderId: "356173268718",
  appId: "1:356173268718:web:330419df432591ea2195ff",
  measurementId: "G-PP7KNDDZ2K"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ==================== АВТОРИЗАЦІЯ ====================
function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => alert("Помилка: " + err.message));
}

function signOut() {
  auth.signOut();
}

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('user-info').textContent = `Привіт, ${user.displayName || user.email.split('@')[0]}`;
    document.getElementById('signout-btn').style.display = 'block';
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    loadUserData(user.uid);
  } else {
    document.getElementById('user-info').textContent = 'Не авторизовано';
    document.getElementById('signout-btn').style.display = 'none';
    document.getElementById('auth-section').style.display = 'block';
    document.getElementById('main-content').style.display = 'none';
  }
});

// ==================== ДАНІ ====================
let userData = {};
let firstDay = null;

function loadUserData(uid) {
  db.collection("users").doc(uid).collection("days").onSnapshot(snap => {
    userData = {};
    snap.forEach(doc => userData[doc.id] = doc.data());
    const dates = Object.keys(userData).sort();
    firstDay = dates.length ? new Date(dates[0]) : null;
    renderCalendar();
    renderCard('today'); // сьогодні
  });
}

function saveData() {
  const user = auth.currentUser;
  if (!user) return alert("Спочатку увійдіть");

  const date = document.getElementById('modal-date').textContent;
  const entry = {
    steps: Number(document.getElementById('steps').value) || 0,
    nutrition: document.getElementById('nutrition').value || "0",
    dmFrags: Number(document.getElementById('dm-frags').value) || 0,
    faceitMatches: Number(document.getElementById('faceit-matches').value) || 0,
    sleepStart: document.getElementById('sleep-start').value,
    sleepEnd: document.getElementById('sleep-end').value,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  };

  db.collection("users").doc(user.uid).collection("days").doc(date).set(entry, {merge: true})
    .then(() => { closeModal(); alert("Збережено!"); })
    .catch(err => alert("Помилка: " + err.message));
}

// ==================== РОЗРАХУНКИ ОЦІНОК ====================
function getNutritionScore(v) { return Number(v) || 0; }

function getMechScore(f) {
  if (f >= 1000) return 5;
  if (f >= 500) return 4;
  if (f >= 250) return 3;
  if (f >= 100) return 2;
  return 1;
}

function getFaceitScore(m) {
  if (m >= 6) return 5;
  if (m >= 4) return 4;
  if (m >= 3) return 3;
  if (m >= 1) return 2;
  return 1;
}

function getSleepScore(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let min = (eh*60 + em) - (sh*60 + sm);
  if (min < 0) min += 1440;
  const hours = min / 60;
  const wakeH = eh + em/60;
  if (hours >= 7.5 && wakeH <= 11) return 5;
  if (hours >= 7.5) return 4;
  if (hours >= 6 && wakeH <= 11) return 3;
  if (hours >= 6) return 2;
  return 1;
}

function getTotalScore(d) {
  if (!d) return 0;
  const s = [
    getNutritionScore(d.nutrition),
    getMechScore(d.dmFrags || 0),
    getFaceitScore(d.faceitMatches || 0),
    getSleepScore(d.sleepStart, d.sleepEnd)
  ];
  return Math.round(s.reduce((a,b)=>a+b,0) / s.length * 10) / 10;
}

// ==================== РЕНДЕР КАРТОК ====================
function renderCard(dateStr) {
  const d = userData[dateStr];
  if (!d) {
    document.getElementById('total-score').textContent = '— / 5';
    // очисти інші картки
    return;
  }

  const nutr = getNutritionScore(d.nutrition);
  const mech = getMechScore(d.dmFrags || 0);
  const face = getFaceitScore(d.faceitMatches || 0);
  const sleep = getSleepScore(d.sleepStart, d.sleepEnd);
  const total = getTotalScore(d);

  // Приклад для однієї картки (додай інші)
  document.getElementById('total-score').textContent = total + ' / 5';
  document.getElementById('total-score').className = `big-score ${total>=4.5?'good':total>=3?'mid':'bad'}`;
}

// ==================== МОДАЛ ====================
function openModal() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('modal-date').textContent = today;
  const d = userData[today] || {};
  document.getElementById('steps').value = d.steps || '';
  document.getElementById('nutrition').value = d.nutrition || '0';
  document.getElementById('dm-frags').value = d.dmFrags || '';
  document.getElementById('faceit-matches').value = d.faceitMatches || '';
  document.getElementById('sleep-start').value = d.sleepStart || '';
  document.getElementById('sleep-end').value = d.sleepEnd || '';
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

// ==================== КАЛЕНДАР ====================
let currentDate = new Date();

function formatDate(d) { return d.toISOString().split('T')[0]; }

function getDayNumber(dateStr) {
  if (!firstDay) return null;
  const diff = new Date(dateStr) - firstDay;
  const days = Math.floor(diff / 86400000) + 1;
  return days > 0 && days <= 1284 ? days : null;
}

function renderCalendar() {
  const y = currentDate.getFullYear();
  const m = currentDate.getMonth();
  document.getElementById('month-year').textContent = currentDate.toLocaleString('uk-UA', {month:'long', year:'numeric'});

  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  let startWd = (first.getDay() + 6) % 7;

  let html = '<tr>';
  for (let i = 0; i < startWd; i++) html += '<td></td>';
  let day = 1;

  while (day <= last.getDate()) {
    if ((startWd + day - 1) % 7 === 0 && day > 1) html += '</tr><tr>';
    const dateStr = formatDate(new Date(y, m, day));
    const has = userData[dateStr] ? ' style="background:#0a4022;cursor:pointer;" onclick="renderCard(\''+dateStr+'\')"' : '';
    const num = getDayNumber(dateStr);
    const label = num ? `<div class="day-label">День №${num}</div>` : '';
    html += `<td\( {has}> \){day}${label}</td>`;
    day++;
  }
  html += '</tr>';
  document.getElementById('calendar-body').innerHTML = html;
}

function prevMonth() { currentDate.setMonth(currentDate.getMonth()-1); renderCalendar(); }
function nextMonth() { currentDate.setMonth(currentDate.getMonth()+1); renderCalendar(); }

// ==================== ПОРІВНЯННЯ ====================
function compareWithYesterday() {
  let yest = new Date();
  yest.setDate(yest.getDate() - 1);
  const todayStr = formatDate(new Date());
  const yestStr = formatDate(yest);

  const t = userData[todayStr];
  const y = userData[yestStr];

  if (!t || !y) return alert('Немає даних для порівняння');

  const ts = getTotalScore(t);
  const ys = getTotalScore(y);

  alert(`Сьогодні: ${ts}/5\nВчора: ${ys}/5\nРізниця: ${(ts - ys).toFixed(1)}`);
}

// Початок
renderCalendar();
</script>
</body>
  </html>
